
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NavaDhiti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container mt-5">
    <div id="homeSection" class="text-center">
      <h2>Welcome to <span class="text-primary fw-bold">NavaDhiti</span></h2>
      <button class="btn btn-primary mt-3" onclick="showLogin('admin')">Login as Admin</button>
      <button class="btn btn-secondary mt-3" onclick="showLogin('employee')">Login as Employee</button>
    </div>

    <div id="loginSection" class="mt-4" style="display: none;">
      <h4 id="loginTitle"></h4>
      <div class="mb-3">
        <input type="text" id="loginName" class="form-control" placeholder="Enter your name or email" />
      </div>
      <div class="mb-3" id="passwordField" style="display: none;">
        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" />
      </div>
      <button class="btn btn-success" onclick="login()">Login</button>
      <button class="btn btn-link" onclick="goHome()">Back to Home</button>
    </div>

    <div id="dashboardSection" style="display: none;">
      <div id="adminDashboard" style="display: none;">
        <h5>Welcome, <span id="adminNameDisplay"></span></h5>
        <div class="mb-3">
          <h6>Register Employee</h6>
          <input type="text" id="employeeName" class="form-control mb-2" placeholder="Employee Name" />
          <select id="employeeRole" class="form-control mb-2">
            <option value="">Select Role</option>
            <option>Software Developer / Engineer</option>
            <option>Backend Developer</option>
            <option>Front-End Developer</option>
            <option>Full-Stack Developer</option>
            <option>DevOps Engineer</option>
          </select>
          <button class="btn btn-primary mb-3" onclick="registerEmployee()">Register</button>
        </div>
      </div>

      <div id="employeeDashboard" style="display: none;">
        <h5>Welcome, <span id="empName"></span></h5>
        <p><strong>Name:</strong> <span id="empNameDisplay"></span></p>
        <p><strong>Employee Key:</strong> <span id="empKeyDisplay"></span> <button class="btn btn-warning btn-sm" onclick="editKey()">Edit Key</button></p>
        <p><strong>Role:</strong> <span id="empRoleDisplay"></span></p>
      </div>

      <div>
        <h6>Employee Directory</h6>
        <input type="text" id="searchInput" class="form-control mb-2" placeholder="Search by ID or Name" />
        <button class="btn btn-info mb-3" onclick="searchEmployee()">Search</button>
        <table class="table table-striped table-bordered">
          <thead>
            <tr><th>ID</th><th>Name</th><th>Role</th><th id="actionHeader">Action</th></tr>
          </thead>
          <tbody id="employeeTableBody"></tbody>
        </table>
        <button class="btn btn-danger" onclick="goHome()">Back to Home</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
